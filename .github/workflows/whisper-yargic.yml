# Math with Zirek · second speech-to-text judge: Whisper large-v3 (open source, free) on TTS voice lines.
# Inputs live in whisper-yargic/<tur>/<lang>/ (NNN.mp3 + istek.json with the script text). Output: artifact whisper-<tur>-<lang>.
# gh workflow run whisper-yargic.yml -f tur=tur0 -f diller="en tr ar"
name: Whisper yargic
on:
  workflow_dispatch:
    inputs:
      tur: {description: "Round folder", required: true, default: "tur0"}
      diller: {description: "Languages (JSON list)", required: true, default: '["en","tr","ar"]'}
      yalniz: {description: "Only these lines (comma list) or empty", required: false, default: ""}
permissions:
  contents: read
jobs:
  yargic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dil: ${{ fromJSON(inputs.diller) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: whisper-yargic
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - run: pip install -q faster-whisper==1.1.1 requests
      - name: transcribe
        run: |
          Y=""; if [ -n "${{ inputs.yalniz }}" ]; then Y="--yalniz ${{ inputs.yalniz }}"; fi
          python whisper-yargic/yargic.py whisper-yargic/${{ inputs.tur }}/${{ matrix.dil }} ${{ matrix.dil }} $Y
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ inputs.tur }}-${{ matrix.dil }}
          path: whisper-yargic/${{ inputs.tur }}/${{ matrix.dil }}/whisper.json
