            if (luma(s) > 0.42) return;                    // only ink lines

            if (kosu.length > 1) { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); kosu[0].before(g); kosu.forEach((e) => g.appendChild(e)); }
            kosu = [];
          };
          Array.from(svg.children).forEach((e) => {
            const tag = e.tagName.toLowerCase();
            if (SEKIL.has(tag) && !e.id && !e.getAttribute('class') && !isik(e)) kosu.push(e); else bitir();
          });

          Array.from(svg.children).forEach((e) => {
            const tag = e.tagName.toLowerCase();
            if (tag === 'defs' || isik(e) || e.hasAttribute('filter')) return;
