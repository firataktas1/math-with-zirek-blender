    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg";
        var tl = gsap.timeline({ paused: true });
        function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        var R = mulberry(4417);
        function rr(a, b) { return a + (b - a) * R(); }
        function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
        function f1(v) { return Math.round(v * 10) / 10; }
        function poly(pts) { return "M" + pts.map(function (p) { return f1(p[0]) + " " + f1(p[1]); }).join(" L") + " Z"; }
        function smoothOpen(p) {
          var n = p.length, d = "M" + f1(p[0][0]) + " " + f1(p[0][1]);
          for (var i = 0; i < n - 1; i++) {
            var p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(n - 1, i + 2)];
            d += " C" + f1(p1[0] + (p2[0] - p0[0]) / 6) + " " + f1(p1[1] + (p2[1] - p0[1]) / 6) + " " + f1(p2[0] - (p3[0] - p1[0]) / 6) + " " + f1(p2[1] - (p3[1] - p1[1]) / 6) + " " + f1(p2[0]) + " " + f1(p2[1]);
          }
          return d;
        }
        var arka = document.getElementById("arka"), onduvar = document.getElementById("onduvar");
        var keseArka = document.getElementById("kese-arka"), keseOn = document.getElementById("kese-on");
        var tasAlan = document.getElementById("tas-alan"), yakin = document.getElementById("yakin");

        // ---------- fotoğrafın perspektifi: ufuk y=378, kamera ~1,6 m ----------
        var YH = 378;
        function kpm(y) { return (y - YH) / 1.6; } // bir metrenin piksel boyu
        var CX = 1230, CY = 600, RX = 540, RY = 150;
        function ep(th) { var t = th * Math.PI / 180; return [CX + RX * Math.cos(t), CY + RY * Math.sin(t)]; }
        function wallH(y) { return 0.55 * kpm(y); }

        function wall(parent, th0, th1, face) {
          var base = [], top = [], cap = [];
          for (var th = th0; th <= th1 + 0.001; th += 1.5) {
            var p = ep(th), h = wallH(p[1]), j = rr(-0.08, 0.08) * h * 0.3;
            base.push([p[0], p[1] + 2]);
            top.push([p[0], p[1] - h + j]);
            cap.push([p[0], p[1] - h + j - (0.07 * kpm(p[1]) + 3)]);
          }
          // gölge (arka ışık: gölge kameraya doğru düşer)
          var sh = base.map(function (p) { return [p[0] + 6, p[1] + 0.12 * kpm(p[1]) + 4]; });
          el("path", { d: poly(base.concat(sh.slice().reverse())), fill: "#1F2408", opacity: 0.32 }, parent);
          var faceD = poly(base.concat(top.slice().reverse()));
          el("path", { d: faceD, fill: "url(#p-duvar)" }, parent);
          el("path", { d: faceD, fill: face === "ic" ? "#2A1E14" : "#3A2A1A", opacity: face === "ic" ? 0.34 : 0.26 }, parent);
          // alt kısım koyu (zemin teması)
          var mid = base.map(function (p, i) { return [p[0], p[1] - (p[1] - top[i][1]) * 0.35]; });
          el("path", { d: poly(base.concat(mid.slice().reverse())), fill: "#1E160E", opacity: 0.22 }, parent);
          // üst yüzey (güneşe bakar)
          var capD = poly(top.concat(cap.slice().reverse()));
          el("path", { d: capD, fill: "url(#p-duvar)" }, parent);
          el("path", { d: capD, fill: "#FFD9A0", opacity: 0.2 }, parent);
          el("path", { d: smoothOpen(cap), fill: "none", stroke: "#FFE2B0", "stroke-width": 1.6, opacity: 0.55 }, parent);
          // taban otları
          var tufts = "";
          base.forEach(function (p, i) {
            if (i % 2) return;
            var s = kpm(p[1]) / 200;
            for (var b = 0; b < 3; b++) { var x = p[0] + rr(-6, 6), l = rr(8, 20) * s, lean = rr(-6, 6) * s; tufts += "M" + f1(x) + " " + f1(p[1] + 3) + " q" + f1(lean * 0.4) + " " + f1(-l * 0.6) + " " + f1(lean) + " " + f1(-l) + " "; }
          });
          el("path", { d: tufts, fill: "none", stroke: "#6E7534", "stroke-width": 2, "stroke-linecap": "round", opacity: 0.9 }, parent);
          el("path", { d: tufts, fill: "none", stroke: "#A4A054", "stroke-width": 1, "stroke-linecap": "round", opacity: 0.7, transform: "translate(2 1)" }, parent);
        }
        function post(parent, th, hm) {
          var p = ep(th), k = kpm(p[1]), w = 0.19 * k, h = hm * k;
          var pts = [[p[0] - w, p[1] + 2], [p[0] - w * 1.02, p[1] - h * 0.5], [p[0] - w * 0.96, p[1] - h], [p[0] + w * 0.97, p[1] - h - 2], [p[0] + w, p[1] - h * 0.45], [p[0] + w * 1.03, p[1] + 2]];
          el("path", { d: poly([[p[0] - w, p[1] + 3], [p[0] + w * 2.2, p[1] + 0.2 * k], [p[0] + w * 2.4, p[1] + 0.24 * k], [p[0] - w * 0.6, p[1] + 0.14 * k]]), fill: "#1F2408", opacity: 0.3 }, parent);
          var d = poly(pts);
          el("path", { d: d, fill: "url(#p-duvar)" }, parent);
          el("path", { d: d, fill: "url(#g-direk)" }, parent);
          // taş sıraları arası gölge çizgileri
          var lines = "";
          for (var i = 1; i < 6; i++) { var y = p[1] - h * i / 6 + rr(-3, 3); lines += "M" + f1(p[0] - w) + " " + f1(y) + " L" + f1(p[0] + w) + " " + f1(y + rr(-3, 3)) + " "; }
          el("path", { d: lines, stroke: "#20170F", "stroke-width": 2.2, opacity: 0.35, fill: "none" }, parent);
          var capD = poly([[p[0] - w * 1.12, p[1] - h + 1], [p[0] - w * 1.05, p[1] - h - 0.07 * k], [p[0] + w * 1.1, p[1] - h - 0.08 * k], [p[0] + w * 1.14, p[1] - h]]);
          el("path", { d: capD, fill: "url(#p-duvar)" }, parent);
          el("path", { d: capD, fill: "#FFDDA6", opacity: 0.28 }, parent);
          return { x: p[0], y: p[1], w: w, h: h, k: k };
        }

        // ağıl içi zemin: hafif koyu, çiğnenmiş çim
        var ic = [];
        for (var th = 0; th < 360; th += 6) { var q = ep(th); ic.push([q[0], q[1]]); }
        el("path", { d: poly(ic), fill: "#3B3A16", opacity: 0.16 }, arka);
        wall(arka, 170, 350, "ic");
        post(arka, 170, 0.95);
        wall(onduvar, 350, 488, "dis");
        var sagDirek = post(onduvar, 128, 0.98);

        // ---------- kese ----------
        var pegY = sagDirek.y - 0.62 * sagDirek.k, pegX = sagDirek.x + 6;
        el("path", { d: "M" + f1(pegX - 4) + " " + f1(pegY - 5) + " L" + f1(pegX + 26) + " " + f1(pegY + 1) + " L" + f1(pegX + 25) + " " + f1(pegY + 9) + " L" + f1(pegX - 4) + " " + f1(pegY + 6) + " Z", fill: "#6B4A2C" }, onduvar);
        el("path", { d: "M" + f1(pegX - 4) + " " + f1(pegY - 5) + " L" + f1(pegX + 26) + " " + f1(pegY + 1), stroke: "#C99B63", "stroke-width": 2, fill: "none" }, onduvar);
        el("ellipse", { cx: pegX + 25.5, cy: pegY + 5, rx: 2.6, ry: 4.2, fill: "#A37A4C" }, onduvar);
        var M = [pegX + 8, pegY + 44];
        var mx = M[0], my = M[1];
        var gov = "M" + (mx - 26) + " " + (my + 14) + " C " + (mx - 50) + " " + (my + 30) + ", " + (mx - 64) + " " + (my + 64) + ", " + (mx - 60) + " " + (my + 96) + " C " + (mx - 56) + " " + (my + 124) + ", " + (mx - 28) + " " + (my + 136) + ", " + mx + " " + (my + 136) + " C " + (mx + 30) + " " + (my + 136) + ", " + (mx + 58) + " " + (my + 124) + ", " + (mx + 60) + " " + (my + 94) + " C " + (mx + 62) + " " + (my + 62) + ", " + (mx + 48) + " " + (my + 30) + ", " + (mx + 26) + " " + (my + 14) + " Z";
        // kesenin gölgesi direğe
        el("ellipse", { cx: mx + 16, cy: my + 78, rx: 58, ry: 64, fill: "#1A120A", opacity: 0.35 }, keseArka);
        el("path", { d: gov, fill: "url(#p-kese)" }, keseArka);
        el("path", { d: gov, fill: "url(#g-kese)" }, keseArka);
        el("path", { d: "M" + (mx - 30) + " " + (my + 40) + " C " + (mx - 44) + " " + (my + 70) + ", " + (mx - 40) + " " + (my + 104) + ", " + (mx - 28) + " " + (my + 122) + " M " + (mx + 6) + " " + (my + 30) + " C " + (mx + 2) + " " + (my + 70) + ", " + (mx + 6) + " " + (my + 104) + ", " + (mx + 10) + " " + (my + 132) + " M " + (mx + 34) + " " + (my + 36) + " C " + (mx + 46) + " " + (my + 70) + ", " + (mx + 46) + " " + (my + 100) + ", " + (mx + 38) + " " + (my + 124), fill: "none", stroke: "#3A2612", "stroke-width": 2.4, opacity: 0.35, "stroke-linecap": "round" }, keseArka);
        el("path", { d: gov, fill: "none", stroke: "#FFD89C", "stroke-width": 2.5, opacity: 0.5, transform: "translate(-1 -1)", "stroke-dasharray": "0 0" }, keseArka);
        // ağız: arka dudak (içi koyu)
        var agiz = "M" + (mx - 34) + " " + (my + 4) + " C " + (mx - 32) + " " + (my - 10) + ", " + (mx - 20) + " " + (my - 6) + ", " + (mx - 14) + " " + (my - 14) + " C " + (mx - 6) + " " + (my - 6) + ", " + mx + " " + (my - 16) + ", " + (mx + 8) + " " + (my - 12) + " C " + (mx + 16) + " " + (my - 18) + ", " + (mx + 22) + " " + (my - 6) + ", " + (mx + 30) + " " + (my - 12) + " C " + (mx + 34) + " " + (my - 6) + ", " + (mx + 38) + " " + (my - 2) + ", " + (mx + 36) + " " + (my + 6) + " C " + (mx + 14) + " " + (my + 14) + ", " + (mx - 14) + " " + (my + 14) + ", " + (mx - 34) + " " + (my + 4) + " Z";
        el("path", { d: agiz, fill: "url(#p-kese)" }, keseArka);
        el("path", { d: agiz, fill: "#2A1A0C", opacity: 0.35 }, keseArka);
        el("ellipse", { cx: mx + 1, cy: my + 2, rx: 30, ry: 8, fill: "#1E1208", opacity: 0.85 }, keseArka);
        // asma ipi
        el("path", { d: "M" + f1(pegX + 14) + " " + f1(pegY + 6) + " C " + f1(pegX + 4) + " " + f1(pegY + 24) + ", " + (mx - 24) + " " + (my + 6) + ", " + (mx - 24) + " " + (my + 16), fill: "none", stroke: "#8A6A44", "stroke-width": 3.2, "stroke-linecap": "round" }, keseArka);
        el("path", { d: "M" + f1(pegX + 16) + " " + f1(pegY + 6) + " C " + f1(pegX + 26) + " " + f1(pegY + 24) + ", " + (mx + 24) + " " + (my + 6) + ", " + (mx + 24) + " " + (my + 16), fill: "none", stroke: "#8A6A44", "stroke-width": 3.2, "stroke-linecap": "round" }, keseArka);
        // ön dudak + bağ
        var onD = "M" + (mx - 36) + " " + (my + 4) + " C " + (mx - 20) + " " + (my + 20) + ", " + (mx + 20) + " " + (my + 20) + ", " + (mx + 38) + " " + (my + 4) + " C " + (mx + 30) + " " + (my + 16) + ", " + (mx + 20) + " " + (my + 22) + ", " + mx + " " + (my + 22) + " C " + (mx - 20) + " " + (my + 22) + ", " + (mx - 30) + " " + (my + 16) + ", " + (mx - 36) + " " + (my + 4) + " Z";
        el("path", { d: onD, fill: "url(#p-kese)" }, keseOn);
        el("path", { d: onD, fill: "#FFE0AA", opacity: 0.18 }, keseOn);
